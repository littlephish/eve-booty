[project]
name = "eve-booty"
version = "0.1.0"
description = "EVE Booty - cross-character EVE Online asset inventory and net worth tracker"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "keyring>=25.0",
    "platformdirs>=4.2",
]

[project.scripts]
evebooty = "evasset.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evasset"]

[dependency-groups]
dev = [
    "nuitka>=2.4",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP017"]  # UP017 (datetime.UTC) is 3.11+; we support 3.10

[tool.ruff.lint.per-file-ignores]
# Qt's own signatures use QModelIndex() as a default argument.
"src/evasset/ui/models.py" = ["B008"]
"src/evasset/ui/structures_view.py" = ["B008"]
"src/evasset/ui/stockpile_view.py" = ["B008"]
# Tests set env vars and sys.path before importing the package.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
