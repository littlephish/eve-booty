name: Release

# Tag a commit and push the tag to build the Windows artifacts and publish a
# release:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Ships a portable program folder as a zip -- deliberately NOT a onefile exe.
# A onefile build unpacks itself to %TEMP% and runs from there, which Defender
# and CrowdStrike both score as dropper behaviour; a plain program folder does
# not, and the folder layout is what makes the in-app folder-swap update
# possible at all (see src/evasset/updater.py).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the GitHub Release

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  release:
    name: Build & publish Windows artifacts
    needs: test          # never publish a build whose tests did not pass
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Before the install and before Nuitka: this rewrites src/evasset/_version.py
      # from the tag, and that file is both what pyproject reads for the package
      # version and what the app reports in Help -> About and in its ESI
      # User-Agent. Stamping first is what makes "the build's version" and "the
      # tag" the same string by construction rather than by convention.
      #
      # A tag that is not a version fails the job here. It used to fall back to
      # 0.0.0, which is the worst possible answer: 0.0.0 compares older than
      # every real release, so updater.check would offer every user an update
      # forever and never stop.
      - name: Stamp the version from the tag
        id: ver
        run: python scripts/set_version.py "${{ github.ref_name }}"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . nuitka

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-${{ runner.os }}-

      # The icon is generated rather than committed as the source of truth, so
      # a release always carries the current art (and this fails loudly if the
      # generator breaks, instead of shipping an icon-less exe).
      - name: Generate the app icon
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/make_icon.py
          if (-not (Test-Path "src/evasset/assets/booty.ico")) {
            throw "make_icon.py did not produce booty.ico"
          }

      # --standalone, never --onefile: see the header.
      - name: Build (Nuitka standalone, version-stamped from the tag)
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --include-package=evasset `
            --include-package-data=evasset `
            --include-package=keyring.backends `
            --include-package=jaraco `
            --noinclude-default-mode=nofollow `
            --nofollow-import-to=tkinter `
            --windows-console-mode=disable `
            --windows-icon-from-ico=src/evasset/assets/booty.ico `
            --company-name="LittlePhish" `
            --product-name="EVE Booty" `
            --file-version="${{ steps.ver.outputs.file_version }}" `
            --product-version="${{ steps.ver.outputs.file_version }}" `
            --file-description="EVE Booty - EVE Online asset manager" `
            --copyright="EVE Booty" `
            --output-dir=build `
            --output-filename=evebooty.exe `
            --output-folder-name=EVEBooty `
            src/evasset/__main__.py

      # The exe is the thing users actually run and the thing updater.py reads
      # its own version out of, so the tag is checked against the built binary
      # rather than trusted because the flags looked right. Catches a Nuitka
      # flag that silently stopped being honoured, which is exactly the sort of
      # thing that would otherwise ship and then hide the next release from
      # everyone who installed this one.
      - name: Verify the exe carries the tag's version
        shell: pwsh
        run: |
          $exe = "build\EVEBooty.dist\evebooty.exe"
          if (-not (Test-Path $exe)) { throw "Nuitka produced no program folder at build\EVEBooty.dist" }
          $stamped = (Get-Item $exe).VersionInfo.FileVersion
          $expected = "${{ steps.ver.outputs.file_version }}"
          Write-Host "tag=${{ github.ref_name }} expected=$expected exe=$stamped"
          if ($stamped -ne $expected) {
            throw "exe reports FileVersion '$stamped' but the tag says '$expected'"
          }

      # Static, dependency-free update.exe. cargo ships preinstalled on
      # windows-latest. It goes inside the program folder; the app copies it to
      # temp and runs it to apply an update without PowerShell, and therefore
      # without tripping over a locked-down ExecutionPolicy.
      - name: Build updater (Rust)
        shell: pwsh
        run: |
          cargo build --release --manifest-path updater\Cargo.toml
          if (-not (Test-Path "updater\target\release\update.exe")) {
            throw "cargo did not produce update.exe"
          }

      - name: Stage the program folder
        shell: pwsh
        run: |
          # A known path rather than the first *.dist that turns up:
          # --output-folder-name fixes the name, so a glob here could only ever
          # pick up something unexpected.
          if (-not (Test-Path build\EVEBooty.dist)) { throw "Nuitka produced no program folder" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\EVEBooty.dist dist\EVEBooty -Recurse
          Copy-Item updater\target\release\update.exe dist\EVEBooty\update.exe
          # Assert the shape the updater relies on, here, where the error is
          # readable -- not on a user's machine mid-swap.
          foreach ($f in @("evebooty.exe", "update.exe", "evasset\assets\booty.ico")) {
            if (-not (Test-Path "dist\EVEBooty\$f")) { throw "staged folder is missing $f" }
          }

      # Run the thing we are about to publish. The test job above proves the
      # source works; it says nothing about whether the *compiled* build does,
      # and those are different questions -- Nuitka compiles the entry point as
      # a top-level __main__ with no parent package, so a relative import in it
      # fails only here. That shipped once: the exe died instantly on every
      # launch, and because the console is disabled a user saw a double-click
      # do nothing at all. Nothing in a source test suite can catch it.
      #
      # --sync against a scratch data directory exercises the real startup path
      # -- config, the database, migrations, the ESI client -- - without a
      # network or an account, and stops at "No enabled characters".
      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:EVEBOOTY_DATA_DIR = $scratch
          $env:EVEBOOTY_CACHE_DIR = $scratch
          $out = & "dist\EVEBooty\evebooty.exe" --sync 2>&1 | Out-String
          Write-Host $out
          if ($out -match "Traceback|ImportError|ModuleNotFoundError") {
            throw "the built exe raised on startup:`n$out"
          }
          if ($out -notmatch "No enabled characters") {
            throw "the built exe did not reach its startup path:`n$out"
          }
          if (-not (Test-Path (Join-Path $scratch "evasset.sqlite"))) {
            throw "the built exe did not create its database"
          }
          Write-Host "OK: the built exe starts, migrates and opens its database"

      # The updater looks for an asset matching *win*.zip, so keep "win" in the
      # name (src/evasset/updater.py:pick_asset).
      - name: Zip the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\EVEBooty `
            -DestinationPath dist\EVEBooty-${{ steps.ver.outputs.version }}-win64.zip

      - name: Show what will be released
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length | Format-Table

      # Published, not a draft: the updater reads /releases/latest, which skips
      # drafts and prereleases entirely and would never see this otherwise.
      #
      # That same skipping is what makes a suffixed tag a safe rehearsal. Tag
      # v1.2.3-rc1 and this whole job runs for real -- build, stamp, zip,
      # publish -- but GitHub marks it a prerelease, /releases/latest ignores
      # it, and no installed copy is ever offered it. Tag v1.2.3 when it looks
      # right. Without this line an rc would become "latest" and ship itself to
      # everyone.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EVE Booty ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/EVEBooty-*-win64.zip
